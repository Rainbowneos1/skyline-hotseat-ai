<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1216">
<title>Skyline · 天际线</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="title">SKYLINE</span>
    <span class="badge">第 <strong id="round">1</strong>/9 轮</span>
    <span class="badge">当前：<strong id="turn">—</strong></span>
    <span class="badge" id="phase-badge">取骰</span>
    <span id="demo-controls" class="demo-controls"></span>
    <span class="spacer"></span>
    <button id="btn-rules" class="ghost">规则</button>
    <button id="btn-about" class="ghost">声明</button>
    <button id="btn-new" class="ghost">新对局</button>
  </header>

  <div class="layout">
    <section class="players" id="players" data-count="2"></section>

    <aside class="sidebar">
      <div class="card">
        <h3>手上的骰子</h3>
        <div class="dice-row" id="dice"></div>
      </div>
      <div class="card">
        <h3>废弃区</h3>
        <div class="district" id="district"></div>
      </div>
      <div class="card">
        <h3>日志</h3>
        <div class="log" id="log"></div>
      </div>
    </aside>
  </div>
</div>

<footer class="actionbar" id="actionbar">
  <div class="actionbar-inner" id="actions"></div>
</footer>

<div id="modal-root"></div>

<script src="js/data.js"></script>
<script src="js/rng.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/agents/weights.js"></script>
<script src="js/agents/value_linear.js"></script>
<script src="js/agents/solver.js"></script>
<script src="js/agents/agents.js"></script>
<script src="js/ai/decide.js"></script>
<script src="js/ui/board.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
